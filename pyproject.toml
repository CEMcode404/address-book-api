[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "UP",  # modern Python syntax
    "B",   # common bug patterns
]
[tool.pytest.ini_options]
testpaths = ["tests"]